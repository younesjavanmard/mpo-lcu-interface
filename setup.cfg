[metadata]
name = qu_alg_qu_sim_tensor_networks
description = Description string for qu_alg_qu_sim_tensor_networks

[options]
setup_requires =
  setuptools_scm
package_dir =
    =src
packages = find:
include_package_data = true

[options.packages.find]
where = src

[options.extras_require]
tests =
    pytest
    pytest-mock
    pytest-cov
develop =
    pylint
    pytest
    pydocstyle
    pre-commit
    mypy

[mypy]
ignore_missing_imports = true

[isort]
line_length = 88
multi_line_output = 3
known_first_party=qu_alg_qu_sim_tensor_networks
include_trailing_comma=True
use_parentheses=True
default_section = THIRDPARTY
force_sort_within_sections=True
order_by_type=False
